name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wopa
          POSTGRES_PASSWORD: wopa_local
          POSTGRES_DB: wopa
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wopa -d wopa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PRUEBAS_DATABASE_URL: postgres://wopa:wopa_local@localhost:5433/wopa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
